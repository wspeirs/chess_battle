<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess Battle</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <header id="toolbar" class="toolbar">
        <div class="toolbar-group">
          <button id="btn-new-game" class="btn">New Game</button>
          <input
            id="input-fen"
            class="input-fen"
            type="text"
            placeholder="Start FEN (optional)"
            spellcheck="false"
          />
        </div>

        <div class="toolbar-group">
          <button id="btn-engines" class="btn">Engines…</button>
          <button id="btn-mode" class="btn">Mode: Play</button>
          <button id="btn-next" class="btn" disabled>Next</button>
          <button id="btn-move-now" class="btn">Move now</button>
          <button id="btn-flip" class="btn">Flip</button>
          <button id="btn-side-boards" class="btn active">Side boards: ON</button>
        </div>

        <div class="toolbar-group toolbar-spacer">
          <button id="btn-save-pgn" class="btn" disabled>Save PGN</button>
          <button id="btn-save-fen" class="btn">Save FEN</button>
        </div>
      </header>

      <div id="banner-result" class="banner banner-result hidden"></div>
      <div id="banner-error" class="banner banner-error hidden"></div>

      <main id="arena-grid" class="arena-grid">
        <!-- Left column: top color PV1..3 boards -->
        <div id="left-side-column" class="side-column"></div>

        <!-- Center column: top panel, eval bar + main board, bottom panel, move list -->
        <div id="center-column" class="center-column">
          <div id="top-panel" class="pv-panel"></div>
          <div id="main-board-container" class="main-board-container">
            <div id="eval-bar-container" class="eval-bar-container"></div>
            <div id="main-board" class="main-board"></div>
          </div>
          <div id="bottom-panel" class="pv-panel"></div>
          <div id="move-list" class="move-list-container"></div>
        </div>

        <!-- Right column: bottom color PV1..3 boards -->
        <div id="right-side-column" class="side-column"></div>
      </main>
    </div>
  </body>
</html>
